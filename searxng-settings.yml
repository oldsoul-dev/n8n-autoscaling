use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - mojeek
      - startpage
      - wikipedia
      - github
      - stackexchange
      - wikidata

server:
  method: "POST"
  image_proxy: true
  public_instance: false

search:
  formats:
    - html
    - json
  autocomplete: ""
  safe_search: 1

plugins:
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searxng_bm25_reranker.SXNGPlugin:
    active: true

# Custom engines (source: searxng-engines/, baked into the image by
# Dockerfile.searxng). api_key values below are placeholder tokens, not real
# secrets - substituted at container start from GITEA_API_KEY/SHLINK_API_KEY
# env vars by searxng-entrypoint-wrapper.sh. See FORK_CHANGES.md for why.
engines:
  - name: gitea (private)
    engine: gitea_private
    base_url: http://192.168.1.134:3000
    api_key: "__GITEA_API_KEY__"
    shortcut: gitp
    # SearXNG rejects plain http:// per engine by default (enable_http:
    # False) - raises InvalidSchema rather than silently going cleartext.
    # Both custom engines here point at LAN-internal http backends, so both
    # opt in explicitly.
    enable_http: true
    # Activated 2026-09-22 - GITEA_API_KEY is set in .env now.

  - name: shlink
    engine: shlink
    base_url: http://192.168.1.6:8207
    api_key: "__SHLINK_API_KEY__"
    shortcut: go
    enable_http: true
    disabled: false
